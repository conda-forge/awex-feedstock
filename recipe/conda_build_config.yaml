# on windows, `{{ compiler("c") }}` would activate Visual Studio and make that the default C/C++ compiler;
# this pulls in VS and causes cmake to use its cl.exe, which is incompatible with the m2w64 version of windres.exe.
# take the m2w64 compiler setup instead, and match the compiler version pins with the rest of conda-forge, c.f.
# https://github.com/conda-forge/conda-forge-pinning-feedstock/blob/main/recipe/conda_build_config.yaml
c_stdlib:                   # [win]
  - m2w64-sysroot           # [win]
c_stdlib_version:           # [win]
  - 12                      # [win]
c_compiler:                 # [win]
  - gcc                     # [win]
c_compiler_version:         # [win]
  - 15                      # [win]
fortran_compiler:           # [win]
  - gfortran                # [win]
fortran_compiler_version:   # [win]
  - 15                      # [win]
